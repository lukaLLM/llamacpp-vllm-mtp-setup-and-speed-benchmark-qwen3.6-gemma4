[project]
name = "multimodal-compare-lab"
version = "0.1.0"
description = "Local multimodal side-by-side comparison lab for OpenAI-compatible vLLM servers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "hf-transfer>=0.1.9",
  "huggingface-hub>=1.6.0",
  "mypy>=1.19.1",
  "ruff>=0.15.5",
  "pyfiglet>=1.0.4",
  "requests>=2.34.2",
  "rich>=15.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D203", "D212"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
